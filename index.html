        <div class="bg-white p-6 rounded-xl shadow-md hover:shadow-xl transition-all duration-300 transform hover:-translate-y-1 hover:scale-[1.02] border border-gray-50 hover:border-primary/20">

          </div>
          <h4 class="text-lg font-semibold mb-2">现场咨询</h4>

  <!-- 报名二维码模态框 -->

    <div class="bg-white rounded-xl p-6 max-w-sm w-full animate-scale-in shadow-lg">
      <div class="text-center">
        <h3 class="text-xl font-semibold mb-4">报名二维码</h3>
        <div class="bg-gray-100 p-4 mb-4 rounded-lg">
          <img src="https://p9-flow-imagex-sign.byteimg.com/tos-cn-i-a9rns2rl98/rc/pc/code_assistant/91b922cc9afb47ea99410bcf641c2a5d~tplv-a9rns2rl98-image.image?rk3s=8e244e95&amp;rrcfp=e75484ac&amp;x-expires=1753588554&amp;x-signature=1nO%2FCJEAFeVx50oUmOBdiGHLS1E%3D" alt="祁阳市第七中学报名二维码" class="mx-auto w-48 h-48">
        </div>
        <p class="text-gray-600 mb-4">扫描二维码，进行报名</p>
        <button class="bg-primary hover:bg-primary/90 text-white px-6 py-2 rounded-lg transition-all transform hover:scale-105" id="close-signup">关闭</button>
      </div>
    </div>
  </div>

  <script>
    // 常见问题及回答
    const faqAnswers = {
      "领取录取通知书时间": "8月底时间暂定；",
      "志愿填报流程": "见链接<a href='https://mp.weixin.qq.com/s/C_RKEnup_QpCVFYiw6z7rg' target='_blank' class='text-primary hover:underline'>https://mp.weixin.qq.com/s/C_RKEnup_QpCVFYiw6z7rg</a>；",
      "分班考试时间": "8月27日8:30-10:30，语数英三科；",
      "分班考号查询": "分班当天在公众号里面扫码查询；",
      "生活费等费用咨询": "1800元左右，以具体通知为准；",
      "报名方式是什么？": "扫码报名<a href='javascript:void(0)' class='text-primary hover:underline' id='show-signup-btn'>点击显示二维码</a>"
    };
    
    // 其他问题回答
    const defaultAnswers = [
      "感谢您的提问，我们会尽快核实相关信息并回复您。",
      "您的问题非常重要，建议您拨打招生咨询电话17873943784获取更准确的信息。",
      "关于这个问题，我们的招生老师会给您详细解答，请您耐心等待。",
      "您可以关注我们学校的微信公众号，获取最新的招生动态和信息。"
    ];
    
    // DOM元素
    const chatContainer = document.getElementById('chat-container');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const mobileMenuButton = document.getElementById('mobile-menu-button');
    const mobileMenu = document.getElementById('mobile-menu');
    const wechatModal = document.getElementById('wechat-modal');
    const showWechatBtn = document.getElementById('show-wechat');
    const closeWechatBtn = document.getElementById('close-wechat');
    const faqButtons = document.querySelectorAll('.faq-btn');
    const signupModal = document.getElementById('signup-modal');
    const closeSignupBtn = document.getElementById('close-signup');
    
    // 移动端菜单切换
    mobileMenuButton.addEventListener('click', () => {
      mobileMenu.classList.toggle('hidden');
    });
    
    // 显示/隐藏微信二维码
    showWechatBtn.addEventListener('click', () => {
      wechatModal.style.display = 'flex';
    });
    
    closeWechatBtn.addEventListener('click', () => {
      wechatModal.style.display = 'none';
    });
    
    // 显示/隐藏报名二维码
    document.addEventListener('click', (e) => {
      if (e.target.id === 'show-signup-btn') {
        signupModal.style.display = 'flex';
      }
    });
    
    closeSignupBtn.addEventListener('click', () => {
      signupModal.style.display = 'none';
    });
    
    // 点击模态框外部关闭
    wechatModal.addEventListener('click', (e) => {
      if (e.target === wechatModal) {
        wechatModal.style.display = 'none';
      }
    });
    
    signupModal.addEventListener('click', (e) => {
      if (e.target === signupModal) {
        signupModal.style.display = 'none';
      }
    });
    
    // 添加消息到聊天窗口
    function addMessage(text, isUser = false) {
      const messageDiv = document.createElement('div');
      messageDiv.className = `flex items-start mb-4 animate-slide-up ${isUser ? 'justify-end' : ''}`;
      
      if (isUser) {
        messageDiv.innerHTML = `
          <div class="bg-primary text-white p-4 rounded-lg rounded-tr-none shadow-sm max-w-[80%]">
            <p>${text}</p>
          </div>
          <div class="w-10 h-10 rounded-full bg-gray-300 flex items-center justify-center ml-3 flex-shrink-0">
            <i class="fa fa-user text-gray-600"></i>
          </div>
        `;
      } else {
        messageDiv.innerHTML = `
          <div class="w-10 h-10 rounded-full bg-primary flex items-center justify-center mr-3 flex-shrink-0">
            <img src="https://p3-flow-imagex-sign.byteimg.com/tos-cn-i-a9rns2rl98/rc/pc/code_assistant/1a95d197f5a74b8c9872962359097b73~tplv-a9rns2rl98-image.image?rk3s=8e244e95&amp;rrcfp=e75484ac&amp;x-expires=1753589723&amp;x-signature=BY1O5OgiFpUm8S7b2hwDRSvZg2E%3D" alt="祁阳市第七中学Logo" class="w-8 h-8 rounded-full object-cover">
          </div>
          <div class="bg-white p-4 rounded-lg rounded-tl-none shadow-sm max-w-[80%]">
            <p>${text}</p>
          </div>
        `;
      }
      
      chatContainer.appendChild(messageDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      
      // 如果是添加报名方式的回答，为链接添加事件监听
      if (text.includes('点击显示二维码') && !isUser) {
        setTimeout(() => {
          const showSignupBtn = document.querySelector('#show-signup-btn');
          if (showSignupBtn) {
            showSignupBtn.addEventListener('click', () => {
              signupModal.style.display = 'flex';
            });
          }
        }, 100);
      }
    }
    
    // 获取随机默认回答
    function getRandomDefaultAnswer() {
      const randomIndex = Math.floor(Math.random() * defaultAnswers.length);
      return defaultAnswers[randomIndex];
    }
    
    // 处理用户输入
    function handleUserInput() {
      const userText = userInput.value.trim();
      if (!userText) return;
      
      // 添加用户消息
      addMessage(userText, true);
      
      // 清空输入框
      userInput.value = '';
      
      // 显示"正在输入"状态
      const typingDiv = document.createElement('div');
      typingDiv.className = 'flex items-start mb-4 animate-slide-up';
      typingDiv.innerHTML = `
        <div class="w-10 h-10 rounded-full bg-primary flex items-center justify-center mr-3 flex-shrink-0">
          <img src="https://p3-flow-imagex-sign.byteimg.com/tos-cn-i-a9rns2rl98/rc/pc/code_assistant/1a95d197f5a74b8c9872962359097b73~tplv-a9rns2rl98-image.image?rk3s=8e244e95&amp;rrcfp=e75484ac&amp;x-expires=1753589723&amp;x-signature=BY1O5OgiFpUm8S7b2hwDRSvZg2E%3D" alt="祁阳市第七中学Logo" class="w-8 h-8 rounded-full object-cover">
        </div>
        <div class="bg-white p-4 rounded-lg rounded-tl-none shadow-sm max-w-[80%]">
          <div class="flex space-x-1">
            <div class="w-2 h-2 bg-gray-400 rounded-full animate-pulse"></div>
            <div class="w-2 h-2 bg-gray-400 rounded-full animate-pulse" style="animation-delay: 0.2s"></div>
            <div class="w-2 h-2 bg-gray-400 rounded-full animate-pulse" style="animation-delay: 0.4s"></div>
          </div>
        </div>
      `;
      
      chatContainer.appendChild(typingDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      
      // 模拟AI思考时间
      setTimeout(() => {
        // 移除"正在输入"状态
        chatContainer.removeChild(typingDiv);
        
        // 获取回答
        let answer;
        if (faqAnswers[userText]) {
          answer = faqAnswers[userText];
        } else {
          // 检查用户问题是否包含常见问题关键词
          const matchedQuestion = Object.keys(faqAnswers).find(question => 
            userText.toLowerCase().includes(question.toLowerCase())
          );
          
          if (matchedQuestion) {
            answer = faqAnswers[matchedQuestion];
          } else {
            answer = getRandomDefaultAnswer();
          }
        }
        
        // 添加AI回答
        addMessage(answer.replace(/\n/g, '<br>'));
      }, 1000);
    }
    
    // 发送按钮点击事件
    sendBtn.addEventListener('click', handleUserInput);
    
    // 回车键发送消息
    userInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') {
        handleUserInput();
      }
    });
    
    // 常见问题按钮点击事件
    faqButtons.forEach(button => {
      button.addEventListener('click', () => {
        const question = button.getAttribute('data-question');
        userInput.value = question;
        handleUserInput();
      });
    });
    
    // 导航栏滚动效果
    window.addEventListener('scroll', () => {
      const header = document.querySelector('header');
      if (window.scrollY > 10) {
        header.classList.add('py-2');
        header.classList.remove('py-4');
      } else {
        header.classList.add('py-4');
        header.classList.remove('py-2');
      }
    });
  </script>
